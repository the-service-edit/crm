<!doctype html>
<html lang="en-AU">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<title>TSE CRM</title>
<meta name="theme-color" content="#3A2E25">
<meta name="color-scheme" content="light">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black">
<meta name="apple-mobile-web-app-title" content="TSE CRM">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Geist:wght@300;400;500;600;700&family=Geist+Mono:wght@400;500&display=swap">
<style>
/* Layout: ink rail on the left (top tabs on phones), working canvas on white, lead profile slides in from the right.
   Brand: TSE Sept 2026 system. Blue means websites, butter yellow means email. Pastels are fills; ink carries text. */
/* TSE showcase system: paper ground, dark brown bands, ink type, uppercase Geist headlines.
   Blue chips mean websites, butter chips mean email. */
:root{
  --bg:#FFFFFF; --canvas:#F7F4EC; --surface:#FFFFFF; --ink:#1B1512; --ink-2:#3d342d; --ink-3:#6B5F54;
  --line:#DED6C8; --line-2:#CFC5B4; --rail:#3A2E25; --rail-fg:#F1EDE2; --rail-dim:#BFB4A3;
  --web:#C9E4FB; --web-ink:#0f3554; --email:#FFEAA6; --email-ink:#4d3b00; --blue:#5B9BD5; --brown:#3A2E25;
  --hl:#EBDDB8; --good:#2f6b45; --good-bg:#DDEBDD; --warn:#8a5a12; --warn-bg:#F3E3C1; --bad:#a3392f; --bad-bg:#F5DCD5;
  --shadow:0 24px 60px rgba(27,21,18,.18);
  --f-sans:"Geist","Helvetica Neue",Arial,sans-serif;
  --f-mono:"Geist Mono",ui-monospace,"SF Mono",Menlo,monospace;
  --r-sm:10px; --r:14px; --r-lg:20px; color-scheme:light;
}
*{box-sizing:border-box}
html,body{height:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--f-sans);font-size:14px;line-height:1.45;-webkit-font-smoothing:antialiased}
button,input,select,textarea{font:inherit;color:inherit}
a{color:inherit}
:focus-visible{outline:2px solid var(--blue);outline-offset:2px}
.mono{font-family:var(--f-mono);font-size:11.5px;letter-spacing:.02em}
.label{font-family:var(--f-mono);font-size:10.5px;letter-spacing:.08em;text-transform:uppercase;color:var(--ink-3)}
.num{font-variant-numeric:tabular-nums}
.app{display:grid;grid-template-columns:220px minmax(0,1fr);min-height:100%}
/* rail */
.rail{background:var(--rail);color:var(--rail-fg);padding:22px 14px;display:flex;flex-direction:column;gap:22px;position:sticky;top:0;height:100vh}
.brand{display:flex;align-items:center;gap:10px;padding:0 6px}
.brand .mark{width:30px;height:30px;border-radius:9px;background:var(--rail-fg);color:var(--rail);display:grid;place-items:center;font-weight:700;font-size:14px;letter-spacing:-.02em}
.brand b{font-weight:600;font-size:15px;letter-spacing:-.01em}
.brand small{display:block;color:var(--rail-dim);font-family:var(--f-mono);font-size:10px;letter-spacing:.08em;text-transform:uppercase}
.nav{display:flex;flex-direction:column;gap:2px}
.nav a{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:8px 10px;border-radius:9px;text-decoration:none;color:var(--rail-dim);font-weight:500}
.nav a:hover{color:var(--rail-fg);background:rgba(255,255,255,.06)}
.nav a.on{color:var(--rail-fg);background:rgba(255,255,255,.1)}
.nav .dot{width:8px;height:8px;border-radius:50%}
.nav .count{font-family:var(--f-mono);font-size:10.5px;color:var(--rail-dim)}
.rail-foot{margin-top:auto;display:flex;flex-direction:column;gap:8px}
.rail-foot button{background:transparent;border:1px solid rgba(255,255,255,.16);color:var(--rail-fg);border-radius:9px;padding:8px 10px;text-align:left;cursor:pointer}
.rail-foot button:hover{background:rgba(255,255,255,.06)}
.sync-note{color:var(--rail-dim);font-size:11px;padding:0 4px}
/* main */
.main{min-width:0;padding-block:24px 60px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.wrap{max-width:1280px;margin:0 auto;display:flex;flex-direction:column;gap:20px}
.head{display:flex;align-items:flex-end;justify-content:space-between;gap:16px;flex-wrap:wrap}
.head h1{margin:0;font-size:28px;font-weight:600;letter-spacing:-.025em;text-wrap:balance}
.head p{margin:4px 0 0;color:var(--ink-2)}
.hl{background:linear-gradient(transparent 55%,var(--hl) 55%,var(--hl) 92%,transparent 92%);padding:0 2px}
.actions{display:flex;gap:8px;flex-wrap:wrap}
.btn{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line-2);background:var(--surface);border-radius:10px;padding:7px 12px;cursor:pointer;font-weight:500;text-decoration:none;white-space:nowrap}
.btn:hover{border-color:var(--ink-3)}
.btn.primary{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.btn.sm{padding:4px 9px;font-size:12.5px;border-radius:8px}
.btn.ghost{border-color:transparent;background:transparent}
.btn.ghost:hover{background:var(--canvas)}
.btn[disabled]{opacity:.5;cursor:default}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:var(--r-lg);padding:18px;min-width:0}
.panel h2{margin:0 0 12px;font-size:15px;font-weight:600;letter-spacing:-.01em;display:flex;align-items:center;justify-content:space-between;gap:8px}
.panel h2 .label{font-weight:400}
.grid{display:grid;gap:16px}
.g2{grid-template-columns:repeat(2,minmax(0,1fr))}
.g3{grid-template-columns:repeat(3,minmax(0,1fr))}
.g-today{grid-template-columns:minmax(0,1.6fr) minmax(0,1fr)}
/* metrics strip */
.metrics{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));background:var(--surface);border:1px solid var(--line);border-radius:var(--r-lg);overflow:hidden}
.metric{padding:14px 16px;border-right:1px solid var(--line);min-width:0}
.metric:last-child{border-right:0}
.metric .v{font-size:22px;font-weight:600;letter-spacing:-.02em;font-variant-numeric:tabular-nums;margin-top:4px}
.metric .s{color:var(--ink-3);font-size:12px}
/* goal */
.goal{display:flex;align-items:center;gap:18px;flex-wrap:wrap}
.goal-ring{--p:0;width:74px;height:74px;border-radius:50%;background:conic-gradient(var(--ink) calc(var(--p)*1%),var(--line) 0);display:grid;place-items:center;flex:none}
.goal-ring span{width:58px;height:58px;border-radius:50%;background:var(--surface);display:grid;place-items:center;font-weight:600;font-size:16px}
/* lists */
.list{display:flex;flex-direction:column}
.row{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:10px;align-items:center;padding:10px 0;border-top:1px solid var(--line)}
.row:first-child{border-top:0}
.row .t{font-weight:500;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.row .sub{color:var(--ink-3);font-size:12.5px;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.row.click{cursor:pointer}
.row.click:hover .t{text-decoration:underline;text-decoration-color:var(--line-2)}
.empty{color:var(--ink-3);padding:14px 0;font-size:13px}
.tabs{display:flex;gap:4px;flex-wrap:wrap;border-bottom:1px solid var(--line);margin:-4px 0 6px}
.tabs button{border:0;background:transparent;padding:8px 10px;border-bottom:2px solid transparent;cursor:pointer;color:var(--ink-3);font-weight:500;margin-bottom:-1px}
.tabs button.on{color:var(--ink);border-color:var(--ink)}
.tabs .n{font-family:var(--f-mono);font-size:10.5px;margin-left:4px}
/* pills */
.pill{display:inline-flex;align-items:center;gap:5px;border-radius:999px;padding:2px 8px;font-size:11.5px;font-weight:500;white-space:nowrap;border:1px solid transparent}
.p-email{background:var(--email);color:var(--email-ink)}
.p-web{background:var(--web);color:var(--web-ink)}
.p-good{background:var(--good-bg);color:var(--good)}
.p-warn{background:var(--warn-bg);color:var(--warn)}
.p-bad{background:var(--bad-bg);color:var(--bad)}
.p-plain{border-color:var(--line-2);color:var(--ink-2)}
.pri{width:8px;height:8px;border-radius:50%;display:inline-block;flex:none}
.pri-high{background:var(--bad)} .pri-normal{background:transparent} .pri-low{background:transparent}
/* next best */
.nba{display:flex;flex-direction:column;gap:8px}
.nba button{display:flex;align-items:center;justify-content:space-between;gap:10px;text-align:left;border:1px solid var(--line);background:var(--canvas);border-radius:12px;padding:11px 13px;cursor:pointer}
.nba button:hover{border-color:var(--ink-3)}
.nba b{font-weight:600}
.nba .arrow{color:var(--ink-3);flex:none}
/* bars */
.bars{display:flex;align-items:flex-end;gap:10px;height:120px;padding-top:6px}
.bars .col{flex:1;display:flex;flex-direction:column;align-items:center;gap:6px;min-width:0;height:100%}
.bars .stack{flex:1;width:100%;display:flex;align-items:flex-end;justify-content:center;gap:3px}
.bars .b{width:42%;max-width:18px;border-radius:5px 5px 2px 2px;background:var(--ink);min-height:2px}
.bars .b.r{background:var(--blue)}
.bars .x{font-family:var(--f-mono);font-size:10px;color:var(--ink-3)}
.legend{display:flex;gap:14px;color:var(--ink-3);font-size:12px}
.legend i{display:inline-block;width:9px;height:9px;border-radius:3px;margin-right:5px;vertical-align:-1px}
.health{display:flex;flex-direction:column;gap:6px}
.hrow{display:grid;grid-template-columns:150px minmax(0,1fr) 70px;gap:10px;align-items:center;font-size:12.5px}
.hrow .track{height:10px;border-radius:5px;background:var(--canvas);overflow:hidden}
.hrow .fill{height:100%;border-radius:5px}
.hrow .stale{color:var(--warn);font-family:var(--f-mono);font-size:10.5px;text-align:right}
/* filter bar */
.filters{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.filters input,.filters select,.field input,.field select,.field textarea,.inline-input{border:1px solid var(--line-2);background:var(--surface);border-radius:10px;padding:7px 10px;min-width:0}
.filters input[type=search]{min-width:220px;flex:1 1 220px}
.seg{display:inline-flex;border:1px solid var(--line-2);border-radius:10px;overflow:hidden}
.seg button{border:0;background:transparent;padding:6px 11px;cursor:pointer;color:var(--ink-3);font-weight:500}
.seg button.on{background:var(--ink);color:var(--bg)}
/* kanban */
.board-wrap{overflow-x:auto;padding-bottom:8px;margin:0 -4px}
.board{display:flex;gap:12px;align-items:flex-start;padding:0 4px;min-height:300px}
.colk{flex:0 0 262px;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);display:flex;flex-direction:column;max-height:calc(100vh - 230px)}
.colk.empty{flex:0 0 96px;background:var(--canvas)}
.colk.empty .colk-h{flex-direction:column;align-items:flex-start;gap:2px;padding:10px}
.colk.empty .colk-h b{font-size:12px;line-height:1.25}
.colk.empty .colk-h b{font-weight:500;color:var(--ink-3)}
.colk.empty .colk-b .empty{font-size:11.5px}
.colk.drop{border-color:var(--blue);box-shadow:0 0 0 2px var(--blue) inset}
.colk-h{padding:11px 12px 8px;display:flex;justify-content:space-between;align-items:baseline;gap:8px;border-bottom:1px solid var(--line)}
.colk-h b{font-weight:600;font-size:13px}
.colk-h .mono{color:var(--ink-3)}
.colk-b{padding:8px;display:flex;flex-direction:column;gap:8px;overflow-y:auto;min-height:60px}
.card{background:var(--bg);border:1px solid var(--line);border-radius:12px;padding:10px 11px;cursor:grab;display:flex;flex-direction:column;gap:6px}
.card:hover{border-color:var(--line-2)}
.card.dragging{opacity:.4}
.card .top{display:flex;justify-content:space-between;gap:8px;align-items:center}
.card .name{font-weight:600;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.card .meta{display:flex;gap:6px;flex-wrap:wrap;align-items:center;color:var(--ink-3);font-size:12px}
.tel{color:var(--ink);font-weight:500;text-decoration:none;font-variant-numeric:tabular-nums;white-space:nowrap}
.tel:hover{text-decoration:underline}
.pill.stage{background:color-mix(in srgb,var(--sc) 20%,#fff);color:var(--ink);border-color:color-mix(in srgb,var(--sc) 45%,#fff)}
.pill.stage i{width:7px;height:7px;border-radius:50%;background:var(--sc);display:inline-block}
.colk-h{border-top:4px solid var(--sc,var(--line));border-radius:var(--r) var(--r) 0 0}
.colk-h b{display:flex;align-items:center;gap:7px}
.colk-h b::before{content:"";width:9px;height:9px;border-radius:50%;background:var(--sc,var(--line));flex:none}
.card{border-left:4px solid var(--sc,var(--line))!important}
.legend-stages{display:flex;gap:6px;flex-wrap:wrap}
.card .meta a{color:var(--ink-2);text-decoration:underline;text-underline-offset:2px}
.card .val{font-family:var(--f-mono);font-size:11.5px;color:var(--ink-2)}
.card.email{border-left:4px solid var(--email)} .card.web{border-left:4px solid var(--web)}
/* tables */
.tbl-wrap{overflow-x:auto;border:1px solid var(--line);border-radius:var(--r);background:var(--surface)}
table{width:100%;border-collapse:collapse;font-size:13px}
th{font-family:var(--f-mono);font-size:10.5px;letter-spacing:.06em;text-transform:uppercase;color:var(--ink-3);font-weight:500;text-align:left;padding:10px 12px;border-bottom:1px solid var(--line);white-space:nowrap;background:var(--surface);position:sticky;top:0}
th.sort{cursor:pointer}
td{padding:9px 12px;border-bottom:1px solid var(--line);vertical-align:top}
tr:last-child td{border-bottom:0}
tr.click{cursor:pointer}
tr.click:hover td{background:var(--canvas)}
td.r,th.r{text-align:right}
.subj{font-weight:500;max-width:380px}
.clip{max-width:260px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.bodybox{white-space:pre-wrap;font-size:13px;line-height:1.55;background:var(--canvas);border-radius:12px;padding:14px;max-height:420px;overflow:auto;margin-top:8px;overflow-wrap:anywhere}
/* drawer */
.scrim{position:fixed;inset:0;background:rgba(17,18,16,.35);z-index:40}
.drawer{position:fixed;top:0;right:0;bottom:0;width:min(760px,100%);background:var(--bg);z-index:41;box-shadow:var(--shadow);display:flex;flex-direction:column;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
.d-head{padding:18px 22px 14px;padding-right:max(22px,env(safe-area-inset-right,0px));border-bottom:1px solid var(--line);display:flex;flex-direction:column;gap:8px}
.d-head .row1{display:flex;justify-content:space-between;align-items:flex-start;gap:12px}
.d-head h2{margin:0;font-size:22px;font-weight:600;letter-spacing:-.02em}
.d-body{overflow-y:auto;padding:18px 22px 40px;padding-right:max(22px,env(safe-area-inset-right,0px));display:flex;flex-direction:column;gap:18px}
.sec{display:flex;flex-direction:column;gap:10px}
.sec>h3{margin:0;font-size:13px;font-weight:600;display:flex;justify-content:space-between;align-items:center;gap:8px}
.fields{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.field{display:flex;flex-direction:column;gap:4px;min-width:0}
.field.full{grid-column:1/-1}
.field label{font-family:var(--f-mono);font-size:10px;letter-spacing:.08em;text-transform:uppercase;color:var(--ink-3)}
.field textarea{min-height:90px;resize:vertical;line-height:1.5}
.field input[type=checkbox]{width:auto}
.opp{border:1px solid var(--line);border-radius:var(--r);padding:14px;display:flex;flex-direction:column;gap:12px}
.opp.email{background:linear-gradient(90deg,var(--email) 0 5px,transparent 5px)}
.opp.web{background:linear-gradient(90deg,var(--web) 0 5px,transparent 5px)}
.opp-h{display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap}
.timeline{display:flex;flex-direction:column}
.ev{display:grid;grid-template-columns:22px minmax(0,1fr);gap:10px;padding:10px 0;border-top:1px solid var(--line)}
.ev:first-child{border-top:0}
.ev .ic{width:22px;height:22px;border-radius:7px;display:grid;place-items:center;font-family:var(--f-mono);font-size:10px;font-weight:600}
.ic-out{background:var(--ink);color:var(--bg)} .ic-in{background:var(--blue);color:#fff} .ic-draft{border:1px dashed var(--ink-3);color:var(--ink-3)} .ic-note{background:var(--canvas);color:var(--ink-2)}
.ev .h{display:flex;justify-content:space-between;gap:8px;align-items:baseline;flex-wrap:wrap}
.ev .h b{font-weight:600;overflow-wrap:anywhere}
.ev .when{color:var(--ink-3);font-size:12px;white-space:nowrap}
.ev .snip{color:var(--ink-2);font-size:13px;margin-top:3px;overflow:hidden;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;cursor:pointer}
.composer{border:1px solid var(--line);border-radius:var(--r);padding:12px;display:flex;flex-direction:column;gap:10px;background:var(--canvas)}
.composer .seg{background:var(--surface)}
.files{display:flex;flex-direction:column;gap:6px}
.file{display:flex;align-items:center;justify-content:space-between;gap:10px;border:1px solid var(--line);border-radius:12px;padding:9px 11px}
.file .nm{font-weight:500;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.taskwrap{border-top:1px solid var(--line)}
.taskwrap:first-child{border-top:0}
.taskwrap .task{border-top:0}
.taskwrap.open{background:var(--canvas);border-radius:12px;padding:0 10px 12px;margin:4px -10px}
.taskbody{padding:4px 0 0 26px}
.tnote{color:var(--ink-3);font-size:12px}
.task{display:flex;align-items:center;gap:10px;padding:8px 0;border-top:1px solid var(--line)}
.task:first-child{border-top:0}
.task input{width:16px;height:16px;flex:none}
.task.done .tt{text-decoration:line-through;color:var(--ink-3)}
.task .tt{flex:1;min-width:0}
.modal{position:fixed;inset:0;z-index:50;display:grid;place-items:center;padding:16px}
.modal .box{background:var(--bg);border-radius:var(--r-lg);box-shadow:var(--shadow);width:min(560px,100%);max-height:90vh;overflow:auto;padding:22px;display:flex;flex-direction:column;gap:14px}
.modal h2{margin:0;font-size:18px;font-weight:600}
.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:12px;z-index:60;font-weight:500;max-width:calc(100% - 32px)}
.banner{border:1px solid var(--line-2);background:var(--surface);border-radius:var(--r);padding:12px 14px;color:var(--ink-2)}
.banner.warn{background:var(--warn-bg);color:var(--warn);border-color:transparent}
.kv{display:grid;grid-template-columns:auto minmax(0,1fr);gap:4px 14px;font-size:13px}
.kv dt{color:var(--ink-3)} .kv dd{margin:0;overflow-wrap:anywhere}
.angle-bar{height:8px;border-radius:4px;background:var(--canvas);overflow:hidden;min-width:60px}
.angle-bar i{display:block;height:100%;background:var(--ink)}
.sample{font-family:var(--f-mono);font-size:10px;letter-spacing:.06em;text-transform:uppercase;color:var(--warn)}
@media (max-width:1100px){.metrics{grid-template-columns:repeat(3,minmax(0,1fr))}.metric:nth-child(3n){border-right:0}.metric:nth-child(-n+3){border-bottom:1px solid var(--line)}.g-today{grid-template-columns:minmax(0,1fr)}.g3{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media (max-width:820px){
  .app{grid-template-columns:minmax(0,1fr)}
  .rail{position:sticky;top:0;height:auto;flex-direction:row;align-items:center;gap:10px;padding:10px max(12px,env(safe-area-inset-right,0px)) 10px max(12px,env(safe-area-inset-left,0px));z-index:30;overflow-x:auto}
  body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:31;background:var(--rail)}
  .brand small,.brand b,.rail-foot .sync-note{display:none}
  .nav{flex-direction:row;gap:2px}
  .nav a{padding:7px 10px;white-space:nowrap}
  .nav .dot,.nav .count{display:none}
  .rail-foot{margin:0;flex-direction:row}
  .rail-foot button{white-space:nowrap;padding:7px 10px}
  .g2,.g3{grid-template-columns:minmax(0,1fr)}
  .metrics{grid-template-columns:repeat(2,minmax(0,1fr))}
  .metric{border-right:0!important;border-bottom:1px solid var(--line)}
  .metric:nth-child(odd){border-right:1px solid var(--line)!important}
  .fields{grid-template-columns:minmax(0,1fr)}
  .hrow{grid-template-columns:110px minmax(0,1fr) 54px}
  .head h1{font-size:24px}
  .colk{flex-basis:84vw;max-height:none}
  .filters input[type=search]{min-width:0}
}

html{padding-top:0;padding-bottom:0}

{ const cm=(location.hash||'').match(/^#client=([\w-]+)/); if(cm){ S.view='clients'; S.clientOpen=cm[1]; } }

const fmtRel = day => { if(!day) return '—'; const n=daysBetween(today(), day); if(n===0) return 'Today'; if(n===1) return 'Tomorrow'; if(n===-1) return 'Yesterday'; return n<0 ? Math.abs(n)+'d overdue' : 'in '+n+'d'; };

/* Credit each inbound reply to the latest sent email before it, so follow-ups get credit too. */
function emailStats(){
  const byCo={};
  list(S.acts).forEach(a=>{ (byCo[a.companyId]=byCo[a.companyId]||[]).push(a); });
  const res={};
  Object.values(byCo).forEach(arr=>{
    arr.sort((a,b)=>(a.at||'').localeCompare(b.at||''));
    const sent=arr.filter(a=>isOutEmail(a)&&a.status==='sent');

    arr.filter(isRealReply).forEach(r=>{
      const prior=sent.filter(e=>(e.at||'')<=(r.at||''));
      const e=prior[prior.length-1];
      if(e && !res[e._id].replied){ res[e._id]={replied:true, days:Math.max(0,daysBetween(localDay(e.at),localDay(r.at))), outcome:r.outcome||null, replyId:r._id}; }
    });

  return res;
}
function lastOut(cid){ return actsOf(cid).find(a=>isOutEmail(a)&&a.status==='sent'); }
function lastIn(cid){ return actsOf(cid).find(isRealReply); }

/* ---------- writes ---------- */
async function put(col,id,data){ await write(col,id,data); }
/* patch: show the change at once, then send ONLY the changed fields. The database merges them into the stored record
   (rpc crm_merge), so a stale copy here can never wipe what the Gmail sync, tracking or the sweeps wrote in the meantime. */
async function patch(col,id,data){
  if(!sb||!user) return toast('Sign in first');
  const key=col==='settings'?null:STATEKEY[TABLE[col]]; const cur=col==='settings'?(id==='main'?(S.settings||{}):(S.extra[id]||{})):(S[key][id]||{});
  const delta=Object.assign({},data); delete delta._id;
  const merged=Object.assign({},cur,delta); delete merged._id;
  if(col!=='settings') S[key]=Object.assign({},S[key],{[id]:Object.assign({},merged,{_id:id})}); else if(id==='main') S.settings=merged; else S.extra[id]=merged;
  schedule();
  const company=['opps','acts','docs','tasks','clients'].includes(col)?(merged.companyId||null):null;
  const {data:out,error}=await sb.rpc('crm_merge',{p_table:TABLE[col],p_id:id,p_data:delta,p_company:company});
  if(error){ if(/crm_merge|function|schema cache/i.test(error.message||'')){ await write(col,id,merged); return; } handleDbErr(error); throw error; }
  if(out && col!=='settings' && S[key][id]){ S[key]=Object.assign({},S[key],{[id]:Object.assign({},out,{_id:id})}); schedule(); }
}
async function write(col,id,data){
  if(!sb||!user) return toast('Sign in first');
  const clean=Object.assign({},data); delete clean._id;
  const row={id,data:clean,updated_at:nowIso()};
  if(['opps','acts','docs','tasks','clients'].includes(col)) row.company_id=clean.companyId||null;
  if(col!=='settings'){ const key=STATEKEY[TABLE[col]]; S[key]=Object.assign({},S[key],{[id]:Object.assign({},clean,{_id:id})}); } else if(id==='main') S.settings=clean; else S.extra[id]=clean;
  schedule();
  const {error}=await sb.from(TABLE[col]).upsert(row);
  if(error){ handleDbErr(error); throw error; }
}
async function del(col,id){ if(!sb) return; if(col!=='settings'){ const key=STATEKEY[TABLE[col]]; const n=Object.assign({},S[key]); delete n[id]; S[key]=n; schedule(); } const {error}=await sb.from(TABLE[col]).delete().eq('id',id); if(error) handleDbErr(error); }
function handleDbErr(e){ const m=(e&&(e.message||''))+''; if(/row-level security|permission/i.test(m)) toast('That change was refused: this account is not the CRM owner.'); else if(/fetch|network/i.test(m)) toast('No connection. Your change will need redoing once you are back online.'); else toast('Could not save: '+m.slice(0,80)); loadAll(); }
async function updateOpp(id, data){ const o=S.opps[id]; if(!o) return; await patch('opps',id,Object.assign({updatedAt:nowIso()},data)); }
async function moveStage(id, stage, note){
  const o=S.opps[id]; if(!o || o.stage===stage) return;
  CHIME.local[id]=Date.now();
  const role=stageRole(stage), rank=ROLE_RANK[role];
  const data={stage, stageChangedAt:nowIso(), updatedAt:nowIso()};
  if(rank>(o.maxRank||0)) data.maxRank=rank;
  if(role==='won' && !o.wonAt) data.wonAt=nowIso();
  if(role==='lost') data.lostAt=nowIso();
  if(role==='won'||role==='lost'){ data.nextFollowUp=''; if(o.onHold) data.onHold=null; }
  await patch('opps',id,data);
  await put('acts',rid('a'),{companyId:o.companyId,oppId:id,type:'stage',subject:(o.stage||'—')+' → '+stage,body:note||'',at:nowIso(),createdAt:nowIso()});
}
/* After an email goes out, push the deal into outreach and book the nudge. */
async function afterSent(cid, oppId, sentIso){
  const day=localDay(sentIso); const nudge=addDays(day, setting('nudgeDays'));
  const targets = oppId ? [S.opps[oppId]].filter(Boolean) : oppsOf(cid).filter(isActive);
  for(const o of targets){
    const r=stageRole(o.stage);
    if(r==='pre'){ const st=stages(o.pipeline).find(s=>stageRole(s)==='out')||o.stage; await moveStage(o._id, st, 'Outreach email sent'); await updateOpp(o._id,{nextFollowUp:nudge, lastContact:sentIso}); }
    else if(r==='out'){ const idx=stages(o.pipeline).indexOf(o.stage); const nxt=stages(o.pipeline)[idx+1]; const nOut=actsOf(cid).filter(a=>isOutEmail(a)&&a.status==='sent').length; if(nOut>1 && nxt && stageRole(nxt)==='out') await moveStage(o._id,nxt,'Follow-up sent'); await updateOpp(o._id,{nextFollowUp:addDays(day, setting('callDays')-setting('nudgeDays')), lastContact:sentIso}); }
    else await updateOpp(o._id,{lastContact:sentIso});
  }
}
async function afterReply(cid, outcome, atIso){
  for(const o of oppsOf(cid).filter(isActive)){
    if(outcome==='no'){ const st=stages(o.pipeline).find(s=>stageRole(s)==='lost'); if(st){ await moveStage(o._id, st, 'Replied: not interested'); continue; } }
    if(['pre','out'].includes(stageRole(o.stage))){ const st=stages(o.pipeline).find(s=>stageRole(s)==='replied'); if(st) await moveStage(o._id, st, 'Reply received'); }
    await updateOpp(o._id,{nextFollowUp:today(), lastContact:atIso});
  }
}

/* Always pick up the newest version: check on open and whenever the app comes back to the front, reload once when it lands. */
function registerSW(){
  if(!('serviceWorker' in navigator) || location.protocol!=='https:') return;
  const had=!!navigator.serviceWorker.controller; let reloaded=false;
  navigator.serviceWorker.addEventListener('controllerchange',()=>{ if(had && !reloaded && !isTyping() && !S.modal){ reloaded=true; location.reload(); } });
  navigator.serviceWorker.register('sw.js',{updateViaCache:'none'}).then(reg=>{ document.addEventListener('visibilitychange',()=>{ if(document.visibilityState==='visible') reg.update().catch(()=>{}); }); }).catch(()=>{});
}
/* ---------- push notifications (crm-push edge function; one subscription per device in crm_push_subs) ---------- */
const PUSH_FN=SB_URL+'/functions/v1/crm-push';
function openFromHash(){ const m=(location.hash||'').match(/^#open=([\w-]+)/); if(!m) return; S.view='email'; S.open=m[1]; history.replaceState(null,'',location.pathname+'#email'); }
const PUSH = {
  state:'checking',
  ios(){ return /iPhone|iPad|iPod/.test(navigator.userAgent) || (navigator.platform==='MacIntel' && navigator.maxTouchPoints>1); },
  standalone(){ return window.matchMedia('(display-mode: standalone)').matches || navigator.standalone===true; },
  supported(){ return 'serviceWorker' in navigator && 'PushManager' in window && 'Notification' in window && location.protocol==='https:'; },
  async refresh(){
    if(!PUSH.supported()){ PUSH.state = PUSH.ios() && !PUSH.standalone() ? 'ios-home' : 'unsupported'; return schedule(); }
    if(Notification.permission==='denied'){ PUSH.state='blocked'; return schedule(); }
    try{ const reg=await navigator.serviceWorker.ready; const sub=await reg.pushManager.getSubscription(); PUSH.state=sub?'on':'off'; }catch(_){ PUSH.state='off'; }
    schedule();
  },
  async id(endpoint){ const h=await crypto.subtle.digest('SHA-256',new TextEncoder().encode(endpoint)); return 'p-'+[...new Uint8Array(h)].slice(0,12).map(b=>b.toString(16).padStart(2,'0')).join(''); },
  device(){ const u=navigator.userAgent; return /iPhone/.test(u)?'iPhone':/iPad/.test(u)?'iPad':/Android/.test(u)?'Android':/Mac/.test(u)?'Mac':'Computer'; },
  async on(){
    try{
      const perm=await Notification.requestPermission(); if(perm!=='granted'){ PUSH.state=perm==='denied'?'blocked':'off'; schedule(); return toast('Notifications were not allowed'); }
      const {pub}=await (await fetch(PUSH_FN)).json();
      const raw=Uint8Array.from(atob(pub.replace(/-/g,'+').replace(/_/g,'/')),c=>c.charCodeAt(0));
      const reg=await navigator.serviceWorker.ready;
      let sub=await reg.pushManager.getSubscription(); if(!sub) sub=await reg.pushManager.subscribe({userVisibleOnly:true,applicationServerKey:raw});
      const j=sub.toJSON(); const {error}=await sb.from('crm_push_subs').upsert({id:await PUSH.id(j.endpoint),data:{sub:j,device:PUSH.device(),ua:navigator.userAgent.slice(0,160),createdAt:nowIso()},updated_at:nowIso()});
      if(error) throw error;
      PUSH.state='on'; schedule(); toast('Notifications on for this '+PUSH.device());
    }catch(e){ toast('Could not turn on notifications: '+String(e&&e.message||e).slice(0,80)); PUSH.refresh(); }
  },
  async off(){
    try{ const reg=await navigator.serviceWorker.ready; const sub=await reg.pushManager.getSubscription(); if(sub){ await sb.from('crm_push_subs').delete().eq('id',await PUSH.id(sub.endpoint)); await sub.unsubscribe(); } }catch(_){}
    PUSH.state='off'; schedule(); toast('Notifications off for this device');
  },
  async test(){
    try{ const {data:{session}}=await sb.auth.getSession(); const r=await fetch(PUSH_FN,{method:'POST',headers:{'Content-Type':'application/json',Authorization:'Bearer '+(session&&session.access_token||'')},body:JSON.stringify({test:true})}); const j=await r.json(); toast(j.devices!=null?`Test sent to ${j.sent} of ${j.devices} device${j.devices===1?'':'s'}`:'Test failed: '+(j.error||r.status)); }
    catch(e){ toast('Test failed: '+String(e&&e.message||e).slice(0,80)); }
  },
  panel(){
    const s=PUSH.state; const msg={
      checking:'Checking this device…',
      on:'On for this device. You will get a notification when a lead first visits their showcase, turns hot, or replies, even with the CRM closed.',
      off:'Get a notification on this device when a lead first visits their showcase, turns hot, or replies, even with the CRM closed. Turn it on for each phone and computer you want alerts on.',
      blocked:'Notifications are blocked for the CRM on this device. Allow them in your browser or phone settings, then come back here.',
      'ios-home':'On iPhone, notifications only work when the CRM is opened from its home-screen icon. In Safari tap Share, then Add to Home Screen, open it from the icon and turn notifications on there.',
      unsupported:'This browser cannot receive notifications. Use Chrome or Safari on your Mac, or the home-screen app on your iPhone.'}[s];
    const btns = s==='on' ? `<button type="button" class="btn" data-push="test">Send a test</button><button type="button" class="btn" data-push="off">Turn off on this device</button>`
      : s==='off' ? `<button type="button" class="btn primary" data-push="on">Turn on notifications</button>` : '';
    return `<div class="panel"><h2>Notifications</h2><p style="color:var(--ink-3);margin:0 0 12px">${msg}</p>${btns?`<div style="display:flex;gap:8px;flex-wrap:wrap">${btns}</div>`:''}</div>`;
  }
};
document.addEventListener('click',e=>{ const b=e.target.closest('[data-push]'); if(!b) return; e.preventDefault(); const k=b.dataset.push; if(k==='on') PUSH.on(); else if(k==='off') PUSH.off(); else if(k==='test') PUSH.test(); });

async function boot(){

  const hk=(location.hash.match(/(?:^#|&)k=([A-Za-z0-9_-]{20,})/)||[])[1];
  if(hk){ try{ localStorage.setItem('tse-crm-key',hk); }catch(_){} history.replaceState(null,'',location.pathname+'#today'); S.view='today'; }
  let key=hk; if(!key){ try{ key=localStorage.getItem('tse-crm-key'); }catch(_){} }
  if(key){
    keyMode=true;
    sb=window.supabase.createClient(SB_URL,SB_KEY,{global:{headers:{'x-crm-key':key}},auth:{persistSession:false,autoRefreshToken:false,detectSessionInUrl:false}});

    try{ localStorage.removeItem('tse-crm-key'); }catch(_){} keyMode=false;
  }

  sb.auth.onAuthStateChange((ev,session)=>{ if(ev==='PASSWORD_RECOVERY'){ recovering=true; user=session&&session.user; renderAuth('recover'); return; } if(recovering) return; const was=user&&user.id; user=session?session.user:null; if(user && user.id!==was) start(); if(!user){ stop(); renderAuth(); } });

/* ---------- chimes: a bright ding when a lead first visits their showcase, a warmer three-note chime when a lead replies ----------
   Compares each load or live change against the last leads it chimed for (kept in this browser), so changes that happened
   while the app was closed chime on the next open. Browsers only allow sound after a tap, so a queued chime plays on the first tap.
   Your own stage moves never chime. Off switch and test buttons live in Settings. */
const CHIME = {
  ctx:null, queue:[], local:{},
  on(){ try{ return localStorage.getItem('tse-crm-sound')!=='0'; }catch(_){ return true; } },
  setOn(v){ try{ localStorage.setItem('tse-crm-sound', v?'1':'0'); }catch(_){} },
  unlock(){
    try{

      const c=CHIME.ctx; const go=()=>{ const q=CHIME.queue.splice(0); q.forEach((k,i)=>setTimeout(()=>CHIME.play(k),i*900)); };

    setTimeout(()=>toast(msg),0);
    if(!CHIME.on()) return;
    if(nv.length) CHIME.play('visited');
    if(nr.length) nv.length? setTimeout(()=>CHIME.play('replied'),900) : CHIME.play('replied');
  }
};

/* ---------- TODAY ---------- */
function followups(){
  const t=today(), act=list(S.opps).filter(isActive);
  return {
    overdue: act.filter(o=>o.nextFollowUp && o.nextFollowUp<t).sort((a,b)=>a.nextFollowUp.localeCompare(b.nextFollowUp)),
    due: act.filter(o=>o.nextFollowUp===t),
    upcoming: act.filter(o=>o.nextFollowUp && o.nextFollowUp>t && o.nextFollowUp<=addDays(t,7)).sort((a,b)=>a.nextFollowUp.localeCompare(b.nextFollowUp)),
    waiting: act.filter(o=>['out'].includes(stageRole(o.stage))).map(o=>({o,last:lastOut(o.companyId)})).filter(x=>x.last && !list(S.acts).some(a=>a.companyId===x.o.companyId&&isRealReply(a)&&(a.at||'')>(x.last.at||''))).sort((a,b)=>(a.last.at||'').localeCompare(b.last.at||'')),
    none: act.filter(o=>!o.nextFollowUp && ROLE_RANK[stageRole(o.stage)]>=1)
  };
}
function dueCount(){ const f=followups(); return f.overdue.length+f.due.length; }
function metricsData(){
  const m0=today().slice(0,7);
  const sentM=list(S.acts).filter(a=>isOutEmail(a)&&a.status==='sent'&&localDay(a.at).slice(0,7)===m0).length;
  const repM=list(S.acts).filter(a=>isRealReply(a)&&localDay(a.at).slice(0,7)===m0).length;
  const meetM=list(S.acts).filter(a=>a.type==='meeting'&&localDay(a.at).slice(0,7)===m0).length;
  const act=list(S.opps).filter(isActive);
  const props=act.filter(o=>['proposal','negotiation'].includes(stageRole(o.stage)));
  const wonM=list(S.opps).filter(o=>o.wonAt&&localDay(o.wonAt).slice(0,7)===m0);
  const potMrr=act.filter(o=>o.pipeline==='email').reduce((s,o)=>s+(+o.mrr||0),0);
  const confMrr=list(S.opps).filter(o=>o.pipeline==='email'&&stageRole(o.stage)==='won').reduce((s,o)=>s+(+o.mrr||0),0);
  const webPipe=act.filter(o=>o.pipeline==='web').reduce((s,o)=>s+(+o.value||0),0);
  return {sentM,repM,meetM,props,wonM,potMrr,confMrr,webPipe,act};
}

function viewBoard(p){

/* Opened / Visited: display-only columns between the outreach stages and Replied, filled from tracking (o.track).
   The real stage is untouched, so the Gmail sync and follow-up timing keep working. Visited beats Opened. */
const VIRT={
  'On hold':{color:'#8C7B6B',hint:'Potential, no rush',tip:'Parked on purpose: still a real lead, just not now. The card shows its real stage and the date to pick it back up. Drag it to any stage, or press Take off hold, to bring it back.'},
  'Scheduled':{color:'#6E7FB0',hint:'Queued in Gmail',tip:'Scheduled to send from Gmail (Gmail sync reads your Scheduled folder every 10 minutes). Moves to Outreach sent once it goes.'},
  'Opened':{color:'#C9A227',hint:'Approx. Apple Mail can auto-open',tip:'Opened the email (preview image loaded) but has not visited the showcase. Opens are approximate: iPhone Mail can open emails automatically and Outlook often blocks images.'},
  'Visited':{color:'#2E7D5B',hint:'Looked at their showcase',tip:'Visited their showcase from the tracked link. This is the real interest signal.'}
};
const schedAt = o => { const t=Date.parse(o&&o.scheduledAt||''); return t&&t>Date.now()-3600e3?t:0; };
const schedTxt = o => { const t=schedAt(o); if(!t) return ''; try{ return new Date(t).toLocaleString('en-AU',{timeZone:'Australia/Perth',weekday:'short',day:'numeric',month:'short',hour:'numeric',minute:'2-digit'}); }catch(_){ return ''; } };
const onHold = o => !!(o&&o.onHold&&isActive(o));
const holdTxt = o => { const d=o&&o.onHold&&o.onHold.revisitOn; return d?'Back '+fmtDay(d):'On hold'; };
function boardCol(o){ if(onHold(o)) return 'On hold'; if(o.pipeline==='email'&&stageRole(o.stage)==='pre'&&schedAt(o)) return 'Scheduled'; if(o.pipeline!=='email'||stageRole(o.stage)!=='out') return o.stage; const t=o.track||{}; if(!t.sentAt) return o.stage;
  if(t.visits||t.clicks) return 'Visited'; if(t.opens) return 'Opened'; return o.stage; }
function boardCols(p,st){ let c=[...st]; const w=c.findIndex(x=>['won','lost'].includes(stageRole(x))); c.splice(w>-1?w:c.length,0,'On hold'); if(p!=='email') return c; const o=c.findIndex(x=>stageRole(x)==='out'); if(o>-1) c.splice(o,0,'Scheduled');
  const i=c.findIndex(x=>stageRole(x)==='replied'); if(i>-1) c.splice(i,0,'Opened','Visited'); return c; }
function autoRep(o){ if(!o||stageRole(o.stage)!=='out') return null; const last=lastOut(o.companyId); const ar=actsOf(o.companyId).find(a=>isInbound(a)&&a.outcome==='auto-reply'&&(!last||(a.at||'')>=(last.at||''))); if(!ar) return null; const real=lastIn(o.companyId); return real&&(real.at||'')>(ar.at||'')?null:ar; }
function cardHtml(o){
  const c=S.companies[o.companyId]||{};
  const od=o.nextFollowUp&&o.nextFollowUp<today();
  const val=o.pipeline==='email'?(o.mrr?money(o.mrr)+'/mo':''):(o.value?money(o.value):'');
  const links=[o.mockupUrl?`<a class="ilink" href="${esc(href(o.mockupUrl))}" target="_blank" rel="noopener" data-stop title="Open ${o.pipeline==='web'?'mockup':'showcase'}">${o.pipeline==='web'?'Mockup':'Showcase'}</a>`:'',c.website?`<a class="ilink" href="${esc(href(c.website))}" target="_blank" rel="noopener" data-stop title="Open their website">Site</a>`:'',c.phone?`<a class="ilink" href="${telHref(c.phone)}" data-stop title="Call ${esc(c.phone)}">Call</a>`:''].filter(Boolean).join('');
  return `<article class="card ${o.pipeline}" style="--sc:${stageColor(o.stage)}" draggable="true" data-opp="${o._id}" data-act="open" data-id="${o.companyId}">
    <div class="top"><span class="name">${esc(c.name||'Untitled')}</span>${o.priority==='high'?'<span class="tag-high">High</span>':''}</div>
    <div class="sub">${esc([c.city,c.state].filter(Boolean).join(', ')||'No location')}</div>
    ${boardCol(o)!==o.stage&&(o.stage!=='Outreach sent'||onHold(o))&&boardCol(o)!=='Scheduled'?`<div class="stg">${esc(o.stage)}</div>`:''}
    ${schedAt(o)?`<div class="sched" title="${esc(o.scheduledSubject||'')}">${stageRole(o.stage)==='pre'?'Sends':'Follow-up sends'} ${esc(schedTxt(o))}</div>`:''}
    ${autoRep(o)?`<div class="autorep" title="Their inbox sent an automatic reply on ${esc(fmtDay(autoRep(o).at))}. No real reply yet, so the follow-up timing is unchanged.">Auto-reply received · ${esc(fmtDay(autoRep(o).at))}</div>`:''}
    ${trkLine(o)?`<div class="trk">${hotPill(o)}<span>${esc(trkLine(o))}</span></div>`:''}
    ${onHold(o)?'':nextHtml(o)}
    <div class="foot"><span class="val">${val||'&nbsp;'}</span>${onHold(o)?`<span class="pill ${od||o.nextFollowUp===today()?'p-warn':'p-plain'}" title="${esc((o.onHold&&o.onHold.reason)||'')}">${esc(holdTxt(o))}</span>`:o.nextFollowUp?`<span class="pill ${od?'p-bad':o.nextFollowUp===today()?'p-warn':'p-plain'}">${fmtRel(o.nextFollowUp)}</span>`:''}</div>
    ${links?`<div class="links">${links}</div>`:''}
  </article>`;
}
function oppTable(os,p){

    <td>${stagePill(o.stage)}</td>

/* ---------- OUTREACH / WHAT'S LANDING ---------- */
function viewOutreach(){
  const st=emailStats();
  const sent=list(S.acts).filter(a=>isOutEmail(a)&&a.status==='sent').sort((a,b)=>(b.at||'').localeCompare(a.at||''));
  const drafts=list(S.acts).filter(a=>isOutEmail(a)&&a.status==='draft').sort((a,b)=>(b.at||'').localeCompare(a.at||''));
  const firsts=sent.filter(a=>(a.angle||guessAngle(a.subject,a.body))!=='Follow-up / nudge');
  const rep=sent.filter(a=>st[a._id]&&st[a._id].replied);
  const pos=rep.filter(a=>['interested','meeting'].includes(st[a._id].outcome));
  const avgDays=rep.length?(rep.reduce((s,a)=>s+(st[a._id].days||0),0)/rep.length).toFixed(1):'—';
  const rate=n=>sent.length?Math.round(n/sent.length*100)+'%':'—';
  const group=(fn)=>{ const g={}; sent.forEach(a=>{const k=fn(a); (g[k]=g[k]||{k,sent:0,rep:0,pos:0,ex:a.subject}); g[k].sent++; if(st[a._id]&&st[a._id].replied){g[k].rep++; if(['interested','meeting'].includes(st[a._id].outcome)) g[k].pos++;}}); return Object.values(g).sort((a,b)=>b.sent-a.sent); };
  const tblG=(rows,label)=>`<div class="tbl-wrap"><table><thead><tr><th>${label}</th><th class="r">Sent</th><th class="r">Replies</th><th>Reply rate</th><th class="r">Positive</th><th>Example subject</th></tr></thead><tbody>${rows.map(r=>`<tr><td><b>${esc(r.k)}</b></td><td class="r num">${r.sent}</td><td class="r num">${r.rep}</td><td><div style="display:flex;align-items:center;gap:8px"><div class="angle-bar" style="width:80px"><i style="width:${r.sent?r.rep/r.sent*100:0}%"></i></div><span class="num mono">${r.sent?Math.round(r.rep/r.sent*100):0}%</span></div></td><td class="r num">${r.pos}</td><td class="clip">${esc(r.ex||'')}</td></tr>`).join('')||'<tr><td colspan="6" class="empty">Nothing sent yet.</td></tr>'}</tbody></table></div>`;
  const tabs=[['angles','By angle'],['format','By format'],['log','Every email'],['drafts','Drafts']];
  let body='';
  if(S.outTab==='angles') body=tblG(group(a=>a.angle||guessAngle(a.subject,a.body)),'Subject angle')+`<p style="color:var(--ink-3);font-size:12.5px;margin:2px 0 0">Angles are guessed from the subject and opening; change any email's angle in its row under Every email. A reply counts towards the last email you sent before it.</p>`;
  if(S.outTab==='format') body=`<div class="grid g2">${tblG(group(a=>a.hasImage?'Preview image in email':'No image'),'Image')}${tblG(group(a=>/first month is on results|you don.t pay|no lock-in/i.test(a.body||'')?'Results-based offer':'No offer'),'Offer')}${tblG(group(a=>{const w=words(a.body);return w<120?'Short (under 120 words)':w<250?'Medium (120 to 250)':'Long (250+)';}),'Length')}${tblG(group(a=>{const c=S.companies[a.companyId]||{};return c.state||'Unknown state';}),'State')}</div>`;
  if(S.outTab==='log') body=emailTable(sent,st);
  if(S.outTab==='drafts') body=drafts.length?emailTable(drafts,st):'<div class="panel empty">No drafts waiting. Drafts from the daily lead drop land here.</div>';
  return `<div class="head"><div><h1>Emails sent</h1><p>Every cold email and follow-up, word for word, and what is getting replies</p></div><div class="actions"><span style="color:var(--ink-3);font-size:12.5px;align-self:center">${gmailNote()}</span><button class="btn primary" data-act="log-email-any">+ Log an email</button></div></div>
  <div class="metrics">${metric('Sent',sent.length,firsts.length+' first touch · '+(sent.length-firsts.length)+' follow-up')}${metric('Reply rate',rate(rep.length),rep.length+' repl'+(rep.length===1?'y':'ies'))}${metric('Positive',pos.length,rate(pos.length)+' of sent')}${metric('Avg days to reply',avgDays,'from send to first reply')}${metric('Drafts waiting',drafts.length,'in Gmail, not sent')}${metric('Last sent',sent[0]?fmtDay(sent[0].at):'—',sent[0]?companyName(sent[0].companyId):'')}</div>
  <div class="panel"><div class="tabs">${tabs.map(([k,l])=>`<button data-act="otab" data-k="${k}" class="${S.outTab===k?'on':''}">${l}</button>`).join('')}</div>${body}</div>`;
}
function emailTable(rows,st){

  return `<tr class="click" data-act="expand" data-id="${a._id}"><td class="num" style="white-space:nowrap">${fmtDay(a.at)}</td><td><b>${esc(companyName(a.companyId))}</b></td><td class="subj">${esc(a.subject||'(no subject)')}</td><td><span class="pill p-plain">${esc(a.angle||guessAngle(a.subject,a.body))}</span></td>

}

  const act=os.filter(isActive);
  const wMrr=act.filter(o=>o.pipeline==='email').reduce((s,o)=>s+(+o.mrr||0)*ROLE_PROB[stageRole(o.stage)],0), uMrr=act.filter(o=>o.pipeline==='email').reduce((s,o)=>s+(+o.mrr||0),0);

function renderOverlay(){
  let el=$('#overlay'); if(!el){ el=document.createElement('div'); el.id='overlay'; document.body.appendChild(el); }
  const keep={}; el.querySelectorAll('[data-keep]').forEach(x=>keep[x.dataset.keep]=x.scrollTop);
  const held=holdForms(el);
  el.innerHTML=(S.open&&S.companies[S.open]?drawerHtml(S.companies[S.open]):'')+(S.modal?modalHtml():'');
  restoreForms(el,held);
  el.querySelectorAll('[data-keep]').forEach(x=>{ if(keep[x.dataset.keep]!=null) x.scrollTop=keep[x.dataset.keep]; });
  document.body.classList.toggle('modal-open',!!(S.modal||S.open)); fitViewport();
  renderToast();
}
/* Forms marked data-hold keep what you typed (and where the cursor was) when the drawer redraws. */
function holdForms(root){ const out={}; const a=document.activeElement;
  root.querySelectorAll('form[data-hold]').forEach(f=>{ const v={}; [...f.elements].forEach(x=>{ if(!x.name) return; v[x.name]=x.type==='checkbox'?x.checked:x.value; });
    out[f.dataset.hold]={v,dirty:f.dataset.dirty||'',focus:a&&a.form===f?a.name:null,sel:a&&a.form===f&&typeof a.selectionStart==='number'?[a.selectionStart,a.selectionEnd]:null}; });
  return out; }
function restoreForms(root,held){ root.querySelectorAll('form[data-hold]').forEach(f=>{ const h=held[f.dataset.hold]; if(!h) return;
  [...f.elements].forEach(x=>{ if(!x.name||!(x.name in h.v)) return; if(x.type==='checkbox') x.checked=h.v[x.name]; else x.value=h.v[x.name]; });
  if(h.dirty) f.dataset.dirty=h.dirty;
  if(h.focus){ const x=f.elements[h.focus]; if(x&&x.focus){ x.focus({preventScroll:true}); if(h.sel) try{ x.setSelectionRange(h.sel[0],h.sel[1]); }catch(_){} } } }); }
/* Keep modals inside the part of the screen you can see, even with the phone keyboard up. */
function fitViewport(){ const v=window.visualViewport; const r=document.documentElement.style; if(!v){ r.removeProperty('--vvh'); r.removeProperty('--vvt'); return; } r.setProperty('--vvh',v.height+'px'); r.setProperty('--vvt',v.offsetTop+'px'); }
if(window.visualViewport){ visualViewport.addEventListener('resize',fitViewport); visualViewport.addEventListener('scroll',fitViewport); }
fitViewport();
/* Tap the dimmed area around a modal to close it. */
document.addEventListener('click',e=>{ if(S.modal && e.target.classList && e.target.classList.contains('modal')){ S.modal=null; renderOverlay(); flush(); } });
function renderToast(){ let t=$('#toast'); if(!S.toast){ if(t) t.remove(); return; } if(!t){ t=document.createElement('div'); t.id='toast'; t.className='toast'; t.setAttribute('role','status'); document.body.appendChild(t);} t.textContent=S.toast; }

function evHtml(a,st){
  const open=S.expanded[a._id];
  if(a.type==='stage') return `<div class="ev"><div class="ic ic-note">→</div><div><div class="h"><span style="color:var(--ink-2)">${esc(a.subject)}</span><span class="when">${fmtDay(a.at)}</span></div></div></div>`;
  const inbound=isInbound(a); const draft=a.type==='email'&&a.status==='draft';
  const ic=inbound?'ic-in':draft?'ic-draft':a.type==='email'?'ic-out':'ic-note';
  const lbl={email:inbound?'IN':'OUT',reply:'IN',call:'TEL',meeting:'MTG',note:'N',proposal:'PRO'}[a.type]||'•';
  const s=st[a._id];
  const title=a.type==='email'||a.type==='reply'?(a.subject||'(no subject)'):a.type==='call'?'Call'+(a.outcome?' · '+a.outcome:''):a.type==='meeting'?(a.subject||'Meeting'):a.type==='note'?(a.subject||'Note'):a.subject||a.type;
  if(S.editAct===a._id) return `<div class="ev"><div class="ic ${ic}">${lbl}</div><div style="min-width:0">${actEditorHtml(a)}</div></div>`;
  const isMail=a.type==='email'||a.type==='reply';
  return `<div class="ev"><div class="ic ${ic}">${lbl}</div><div style="min-width:0"><div class="h"><b>${esc(title)}</b><span class="when">${draft?'Draft · ':''}${fmtWhen(a.at)}${a.editedAt?' · edited':''}</span></div>
  <div style="display:flex;gap:6px;flex-wrap:wrap;margin-top:4px">${a.type==='email'&&!inbound?`<span class="pill p-plain">${esc(a.angle||guessAngle(a.subject,a.body))}</span>`:''}${s?(s.replied?`<span class="pill p-good">Got a reply in ${s.days}d</span>`:`<span class="pill p-plain">No reply yet</span>`):''}${inbound&&a.outcome?`<span class="pill ${a.outcome==='interested'?'p-good':a.outcome==='no'?'p-bad':'p-warn'}">${esc(a.outcome)}</span>`:''}${a.hasImage?'<span class="pill p-plain">Image</span>':''}</div>
  ${a.body?(open?`<div class="bodybox">${esc(a.body)}</div>`:`<div class="snip" data-act="expand" data-id="${a._id}">${esc(a.body.slice(0,300))}</div>`):''}
  <div class="actions" style="margin-top:6px">${a.body&&(open||a.body.length>140||/\n/.test(a.body))?`<button class="btn sm ghost" data-act="expand" data-id="${a._id}">${open?'Hide':isMail?'Show full email':'Show all'}</button>`:''}<button class="btn sm ghost" data-act="edit-act" data-id="${a._id}">Edit</button>${draft?`<button class="btn sm" data-act="mark-sent" data-id="${a._id}">I sent this</button>`:''}${a.gmailThreadId?`<a class="btn sm ghost" target="_blank" rel="noopener"${gmWarn(a)} href="https://mail.google.com/mail/u/?authuser=${OUR}#all/${esc(a.gmailThreadId)}">Gmail</a>`:''}<button class="btn sm ghost" data-act="del-act" data-id="${a._id}">Delete</button></div></div></div>`;
}
/* Shows the day, plus the time for anything logged with one (not the 9am placeholder of a back-dated entry). */
function fmtWhen(iso){ if(!iso) return '—'; const d=new Date(iso); if(isNaN(d)) return fmtDay(iso); const day=fmtDay(iso); if(iso.length<=10) return day;
  return day+' · '+d.toLocaleTimeString('en-AU',{hour:'numeric',minute:'2-digit'}).replace(' ','').toLowerCase(); }
const CALL_OUTCOMES=['No answer','Left voicemail','Spoke, interested','Spoke, not now','Spoke, not interested','Booked a meeting'];
const REPLY_OUTCOMES=[['interested','Interested'],['question','Question'],['not now','Not now'],['no','Not interested'],['meeting','Booked a call'],['auto-reply','Auto-reply']];
/* Edit any logged entry in place: when it happened, the outcome, the subject and what was said. */
function actEditorHtml(a){
  const d=a.at?new Date(a.at):new Date(); const day=localDay(d), tm=pad(d.getHours())+':'+pad(d.getMinutes());
  const os=oppsOf(a.companyId);
  const fromGmail=a.source==='gmail'||!!a.gmailMessageId;
  const isMail=a.type==='email'||a.type==='reply';
  let f=`${inp('ea-date','date','Date',day,'date')}${inp('ea-time','time','Time',tm,'time')}`;
  if(a.type==='call') f+=`<div class="field"><label for="ea-out">Outcome</label><select id="ea-out" name="outcome">${CALL_OUTCOMES.concat(CALL_OUTCOMES.includes(a.outcome)||!a.outcome?[]:[a.outcome]).map(x=>`<option ${x===a.outcome?'selected':''}>${esc(x)}</option>`).join('')}</select></div>`;
  if(a.type==='reply'||(a.type==='email'&&isInbound(a))) f+=`<div class="field"><label for="ea-out">How it landed</label><select id="ea-out" name="outcome"><option value="">Not set</option>${REPLY_OUTCOMES.map(([v,l])=>`<option value="${v}" ${v===a.outcome?'selected':''}>${l}</option>`).join('')}</select></div>`;
  if(a.type==='email'&&!isInbound(a)) f+=`<div class="field"><label for="ea-st">Status</label><select id="ea-st" name="status"><option value="sent" ${a.status==='sent'?'selected':''}>Sent</option><option value="draft" ${a.status==='draft'?'selected':''}>Draft, not sent</option></select></div>`;
  if(isMail||a.type==='meeting'||a.type==='note') f+=inp('ea-subj','subject',a.type==='note'?'Heading (optional)':'Subject',a.subject||'','text',true);
  if(os.length>1) f+=`<div class="field"><label for="ea-opp">Deal</label><select id="ea-opp" name="oppId"><option value="">Both</option>${os.map(o=>`<option value="${o._id}" ${a.oppId===o._id?'selected':''}>${o.pipeline==='email'?'Email':'Website'}</option>`).join('')}</select></div>`;
  f+=`<div class="field full"><label for="ea-body">${a.type==='call'?'Notes':a.type==='note'?'Note':isMail?(isInbound(a)?'What they said':'What you said'):'Details'}</label><textarea id="ea-body" name="body" rows="${Math.min(14,Math.max(4,((a.body||'').match(/\n/g)||[]).length+2))}">${esc(a.body||'')}</textarea></div>`;
  const warn=fromGmail&&a.type==='email'&&a.status==='draft'?'This draft is matched to Gmail by its subject. Keep the subject the same as the Gmail draft, or the sync will not mark it sent.':fromGmail?'This came in from Gmail. Editing here changes the CRM copy only, not the email itself.':'';
  return `<form class="composer" data-form="edit-act" data-track data-hold="ea-${a._id}" data-id="${a._id}"><div style="display:flex;justify-content:space-between;align-items:center;gap:8px"><b>Edit ${{email:'email',reply:'reply',call:'call',meeting:'meeting',note:'note',proposal:'entry'}[a.type]||'entry'}</b><button type="button" class="btn sm ghost" data-act="cancel-edit">Cancel</button></div>
    ${warn?`<div style="color:var(--ink-3);font-size:12.5px">${warn}</div>`:''}<div class="fields">${f}</div><div class="actions"><button class="btn primary">Save changes</button></div></form>`;
}

/* Date boxes: Chrome fires "change" on every keystroke while you type a date, and on each tap in the iPhone picker,
   so the app used to save 0002-11-04, 0020-11-04, 0202-11-04... and re-sort Today on each one. Now a date only saves
   once it is a real date (years 2020 to 2100), 600ms after you stop, or straight away when you leave the box. */
const DATE_WAIT=new Map();
const okDate=v=>v===''||(/^\d{4}-\d{2}-\d{2}$/.test(v)&&+v.slice(0,4)>=2020&&+v.slice(0,4)<=2100);
function commitDate(t){ const w=DATE_WAIT.get(t); if(!w) return; clearTimeout(w); DATE_WAIT.delete(t); if(t.value!==t.dataset.saved) onFieldChange(t); }
document.addEventListener('focusout',e=>{ const t=e.target; if(t&&t.type==='date') commitDate(t); },true);
document.addEventListener('change', e=>{
  const t=e.target;
  if(t.type==='date' && !t.closest('form[data-form]') && !t.dataset.filter){
    if(!okDate(t.value)) return;
    if(t.dataset.saved===undefined) t.dataset.saved=t.getAttribute('value')||'';
    clearTimeout(DATE_WAIT.get(t)); DATE_WAIT.set(t,setTimeout(()=>commitDate(t),600)); return;
  }
  onFieldChange(t);
});
async function onFieldChange(t){
  if(t.type==='date') t.dataset.saved=t.value;
  if(t.dataset.filter){ S[t.dataset.filter]=t.value; render(); return; }
  if(t.dataset.stageFor){ await moveStage(t.dataset.stageFor,t.value); flush(); return; }
  if(t.dataset.taskDone){ await patch('tasks',t.dataset.taskDone,{done:t.checked,doneAt:t.checked?nowIso():''}); return; }
  if(t.dataset.angleFor){ await patch('acts',t.dataset.angleFor,{angle:t.value}); flush(); return; }
  if(t.dataset.imgFor){ await patch('acts',t.dataset.imgFor,{hasImage:t.checked}); return; }
  const tf=t.closest('[data-task-fields]'); if(tf && t.name){ const v=t.value; if(t.name==='title'&&!v.trim()){ toast('A task needs a name'); return; } await patch('tasks',tf.dataset.taskFields,{[t.name]:t.name==='title'?v.trim():v}); flush(); return; }
  if(t.dataset.clLogo){ const f=t.files&&t.files[0]; const id=t.dataset.clLogo; t.value=''; if(!f) return; if(!/^image\//.test(f.type)){ toast('That file is not an image'); return; }
    try{ const url=await new Promise((res,rej)=>{ const r=new FileReader(); r.onload=()=>res(r.result); r.onerror=rej; r.readAsDataURL(f); });
      const img=await new Promise((res,rej)=>{ const i=new Image(); i.onload=()=>res(i); i.onerror=rej; i.src=url; });
      const sc=Math.min(1,320/(img.naturalWidth||320),160/(img.naturalHeight||160)); const w=Math.max(1,Math.round((img.naturalWidth||320)*sc)), h=Math.max(1,Math.round((img.naturalHeight||160)*sc));
      const cv=document.createElement('canvas'); cv.width=w; cv.height=h; cv.getContext('2d').drawImage(img,0,0,w,h);
      let out=cv.toDataURL('image/webp',0.86); if(!/^data:image\/webp/.test(out)) out=cv.toDataURL('image/png');
      if(out.length>120000){ toast('That logo is too detailed to store. Try a simpler or smaller file.'); return; }
      await patch('clients',id,{logo:out,updatedAt:nowIso()}); toast('Logo saved'); }catch(_){ toast('Could not read that image'); }
    return; }
  if(t.dataset.clArr){ const cl=S.clients[t.dataset.clArr]; if(!cl) return; const arr=(cl[t.dataset.arr]||[]).map(x=>Object.assign({},x)); const it=arr[+t.dataset.i]; if(!it) return; let v=t.value; if(t.name==='actual') v=v===''?'':Number(v); it[t.name]=v; if(t.dataset.arr==='sends'&&t.name==='status'&&v==='Approved'&&!it.approvedAt) it.approvedAt=nowIso(); if(t.dataset.arr==='invoices'&&t.name==='status'&&v==='Paid') it.paidAt=nowIso(); await patch('clients',cl._id,{[t.dataset.arr]:arr,updatedAt:nowIso()}); flush(); return; }
  const clf=t.closest('[data-cl-fields]'); if(clf && t.name){ let v=t.value; if(t.name==='fee') v=v===''?'':Number(v); else if(typeof v==='string' && t.tagName!=='TEXTAREA') v=v.trim(); await patch('clients',clf.dataset.clFields,{[t.name]:v,updatedAt:nowIso()}); flush(); return; }
  const co=t.closest('[data-co]'); if(co && t.name){ await patch('companies',co.dataset.co,{[t.name]:t.value.trim(),updatedAt:nowIso()}); flush(); return; }
  const hf=t.closest('[data-hold-for]'); if(hf && t.name){ const id=hf.dataset.holdFor, o=S.opps[id]; const h=Object.assign({},o.onHold||{},{[t.name]:t.value}); const data={onHold:h}; if(t.name==='revisitOn'&&t.value) data.nextFollowUp=t.value; await updateOpp(id,data); flush(); return; }
  const of=t.closest('[data-opp-fields]'); if(of && t.name){ let v=t.value; if(['mrr','setupFee','value','retainerScore','higgsCredits'].includes(t.name)) v=t.value===''?'':Number(t.value); const data={[t.name]:v}; if(t.name==='proposalStatus'&&v==='Sent'&&!S.opps[of.dataset.oppFields].proposalSentAt) data.proposalSentAt=nowIso(); await updateOpp(of.dataset.oppFields,data); flush(); return; }
  if(t.id==='file-up'){ const f=t.files[0]; t.value=''; if(S.modal&&S.modal.type==='doc'&&f){ S.modal.file=f; const n=$('#nd-name'); const nm=$('#nd-file'); if(nm) nm.textContent=f.name; if(n&&!n.value) n.value=f.name.replace(/\.[^.]+$/,''); } return; }
  if(t.id==='csv-up'){ const f=t.files[0]; t.value=''; if(f) importCsv(await f.text()); return; }

      const os=oppsOf(cid); const o=os.find(x=>x.pipeline===(fd.service==='Website'?'web':'email'))||os[0]||{};
      const docs=list(S.docs).filter(d=>d.companyId===cid); const links=[];
      docs.forEach(d=>{ if(d.clientLink) links.push({label:(d.kind||'Link')+' (client link)',url:d.clientLink,note:'Send this one to the client'}); if(d.tseLink) links.push({label:(d.kind||'Link')+' (your link)',url:d.tseLink,note:'Yours only'}); if(d.url && !d.clientLink && d.kind!=='Platform') links.push({label:d.name||d.kind||'Link',url:d.url,note:''}); });
      const access=docs.filter(d=>d.kind==='Platform').map(d=>({label:d.name||'Platform',url:d.url,note:''}));
      await put('clients',id,{companyId:cid,oppId:o._id||'',name:c.name||'',service:fd.service||'Email marketing',status:'Onboarding',startDate:fd.startDate||today(),endDate:fd.endDate||'',fee:fd.fee===''?'':Number(fd.fee),tz:fd.tz||'Australia/Perth',contactName:c.contactName||'',contactEmail:c.email||'',contactPhone:c.phone||'',access,links,sends:[],targets:[],invoices:[],keyDates:[],notes:'',createdAt:nowIso()});
      done(); S.modal=null; renderOverlay(); S.clientOpen=id; S.view='clients'; history.replaceState(null,'',location.pathname+'#client='+id); render(); toast('Client added'); break; }
    case 'pick-lead': S.modal=null; S.open=fd.companyId; S.compose={cid:fd.companyId,kind:'email'}; renderOverlay(); break;
    case 'edit-act': {
      const id=f.dataset.id, a=S.acts[id]; if(!a){ S.editAct=null; renderOverlay(); return; }
      if(!okDate(fd.date||'')||!fd.date){ toast('Check the date'); return; }
      const at=new Date(fd.date+'T'+(fd.time||'09:00')+':00'); if(isNaN(at)){ toast('Check the time'); return; }
      const ch={at:at.toISOString(),body:fd.body||'',editedAt:nowIso()};
      ['outcome','subject','status','oppId'].forEach(k=>{ if(k in fd) ch[k]=k==='subject'?fd[k].trim():fd[k]; });
      const wasDraft=a.type==='email'&&a.status==='draft';
      await patch('acts',id,ch); done(); S.editAct=null; renderOverlay();
      if(wasDraft&&ch.status==='sent') await afterSent(a.companyId,ch.oppId!=null?ch.oppId:a.oppId,ch.at);
      toast('Changes saved'); break; }
    case 'compose': {
      const cid=f.dataset.cid, k=f.dataset.kind;
      if(fd.date&&!okDate(fd.date)){ toast('Check the date'); return; } if(fd.next&&!okDate(fd.next)){ toast('Check the follow-up date'); return; }
      const dateIso=fd.date&&fd.date!==today()?new Date(fd.date+'T09:00:00').toISOString():nowIso();
      const c=S.companies[cid]||{};
      if(k==='email'){ const id=rid('a'); await put('acts',id,{companyId:cid,oppId:fd.oppId||'',type:'email',direction:'out',status:fd.status,subject:fd.subject.trim(),body:fd.body||'',angle:fd.angle||guessAngle(fd.subject,fd.body),hasImage:!!fd.hasImage,to:c.email||'',at:dateIso,createdAt:nowIso()}); if(fd.status==='sent') await afterSent(cid,fd.oppId||'',dateIso); }
      if(k==='reply'){ await put('acts',rid('a'),{companyId:cid,type:'reply',direction:'in',subject:fd.subject||'',body:fd.body||'',outcome:fd.outcome,objection:fd.objection||'',at:dateIso,createdAt:nowIso()}); if(fd.outcome==='meeting') await put('acts',rid('a'),{companyId:cid,type:'meeting',subject:'Call booked',at:dateIso,createdAt:nowIso()}); await afterReply(cid,fd.outcome,dateIso); if(fd.outcome==='meeting'){ for(const o of oppsOf(cid).filter(isActive)){ const s=stages(o.pipeline).find(x=>stageRole(x)==='meeting'); if(s) await moveStage(o._id,s,'Call booked'); } } }
      let msg='Saved';
      if(k==='call'){ await put('acts',rid('a'),{companyId:cid,oppId:fd.oppId||'',type:'call',outcome:fd.outcome,body:fd.body||'',at:dateIso,createdAt:nowIso()});
        const na=(fd.nextAction||'').trim();
        for(const o of (fd.oppId?[S.opps[fd.oppId]].filter(Boolean):oppsOf(cid).filter(isActive))){
          const ch={lastContact:dateIso};
          if(fd.next){ ch.nextFollowUp=fd.next; ch.nextAction=na||('Follow up after call ('+fd.outcome.toLowerCase()+', '+fmtDay(localDay(dateIso))+')'); }
          else if(na) ch.nextAction=na;
          await updateOpp(o._id,ch);
        }
        if(/meeting/i.test(fd.outcome)){ await put('acts',rid('a'),{companyId:cid,type:'meeting',subject:'Meeting booked',at:dateIso,createdAt:nowIso()}); }
        const mo=mainOpp(cid); if(!fd.next&&mo&&mo.nextFollowUp&&mo.nextFollowUp<today()) msg='Call saved. The follow-up date is still '+fmtDay(mo.nextFollowUp)+' ('+fmtRel(mo.nextFollowUp)+'): set a new one on the deal.'; }
      if(k==='note') await put('acts',rid('a'),{companyId:cid,type:'note',body:fd.body,at:dateIso,createdAt:nowIso()});
      done(); S.compose=null; renderOverlay(); toast(msg); break; }
    case 'settings': { const g={emailClientsPerMonth:+fd.emailClientsPerMonth||0,webProjectsPerMonth:+fd.webProjectsPerMonth||0,webRevenuePerMonth:+fd.webRevenuePerMonth||0};
      await saveSettings({goals:g,nudgeDays:+fd.nudgeDays||6,callDays:+fd.callDays||11,gst:fd.gst,coreMrr:+fd.coreMrr||0}); done(); toast('Settings saved'); break; }
    case 'stages': { const sp=s=>s.split('\n').map(x=>x.trim()).filter(Boolean); const st={email:sp(fd.email),web:sp(fd.web)};
      if(!['email','web'].every(p=>st[p].some(s=>stageRole(s)==='won')&&st[p].some(s=>stageRole(s)==='lost'))){ toast('Each pipeline needs a Won and a Lost stage'); return; }
      await saveSettings({stages:st}); done(); toast('Stages saved'); break; }
  }
  }catch(_){ /* toast already shown */ }
  flush();
});
async function saveSettings(part){ const cur=Object.assign({},DEFAULT_SETTINGS,S.settings||{}); await put('settings','main',Object.assign(cur,part,{updatedAt:nowIso()})); }

/* drag and drop on the board */
let dragId=null;
document.addEventListener('dragstart',e=>{ const c=e.target.closest&&e.target.closest('.card'); if(!c) return; dragId=c.dataset.opp; c.classList.add('dragging'); e.dataTransfer.effectAllowed='move'; try{e.dataTransfer.setData('text/plain',dragId);}catch(_){} });
document.addEventListener('dragend',e=>{ document.querySelectorAll('.dragging,.drop').forEach(x=>x.classList.remove('dragging','drop')); });
document.addEventListener('dragover',e=>{ const col=e.target.closest&&e.target.closest('.colk'); if(!col||!dragId) return; e.preventDefault(); document.querySelectorAll('.colk.drop').forEach(x=>x!==col&&x.classList.remove('drop')); col.classList.add('drop'); });
document.addEventListener('drop',async e=>{ const col=e.target.closest&&e.target.closest('.colk'); if(!col||!dragId) return; e.preventDefault(); const id=dragId; dragId=null; col.classList.remove('drop'); const o=S.opps[id]; if(col.dataset.stage==='On hold'){ if(o&&!onHold(o)&&isActive(o)){ const back=addDays(today(),60); await updateOpp(id,{onHold:{since:today(),revisitOn:back,reason:''}, nextFollowUp:back}); toast('On hold until '+fmtDay(back)+'. Open the lead to change the date'); } return; } if(col.dataset.virt){ toast(col.dataset.stage+' fills itself from tracking'); return; } const st=col.dataset.stage; if(o&&onHold(o)) await updateOpp(id,{onHold:null}); if(o&&o.stage!==st){ await moveStage(id,st); toast('Moved to '+st); } else if(o&&onHold(o)) toast('Taken off hold'); });

/* ---------- create helpers ---------- */
function findDupe(name,email,web){
  const n=slug(name), e=(email||'').trim().toLowerCase(), w=String(web||'').toLowerCase().replace(/^https?:\/\//,'').replace(/^www\./,'').replace(/\/.*$/,'');
  return list(S.companies).find(c=> (n && n.length>2 && slug(c.name)===n) || (e && (c.email||'').toLowerCase()===e) || (w && w.length>3 && String(c.website||'').toLowerCase().replace(/^https?:\/\//,'').replace(/^www\./,'').replace(/\/.*$/,'')===w));
}
async function createCompany(data){
  let id='c-'+slug(data.name); if(S.companies[id]) id=id+'-'+Math.random().toString(36).slice(2,5);
  await put('companies',id,Object.assign({createdAt:nowIso(),updatedAt:nowIso()},data)); return id;
}
async function createOpp(cid,p,extra){
  const id='o-'+cid.replace(/^c-/,'')+'-'+p+(S.opps['o-'+cid.replace(/^c-/,'')+'-'+p]?'-'+Math.random().toString(36).slice(2,5):'');
  const stg=extra.stage && stages(p).includes(extra.stage) ? extra.stage : stages(p)[0];
  await put('opps',id,Object.assign({companyId:cid,pipeline:p,stage:stg,stageChangedAt:nowIso(),priority:'normal',mrr:p==='email'?setting('coreMrr'):'',value:'',nextFollowUp:'',createdAt:nowIso(),updatedAt:nowIso(),maxRank:ROLE_RANK[stageRole(stg)]},extra,{stage:stg}));
  return id;
}

/* ---------- import / export ---------- */
function parseCsv(text){
  const rows=[]; let row=[], cell='', q=false;
  for(let i=0;i<text.length;i++){ const ch=text[i];
    if(q){ if(ch==='"'){ if(text[i+1]==='"'){cell+='"';i++;} else q=false; } else cell+=ch; }
    else if(ch==='"') q=true; else if(ch===','){ row.push(cell); cell=''; } else if(ch==='\n'||ch==='\r'){ if(ch==='\r'&&text[i+1]==='\n') i++; row.push(cell); rows.push(row); row=[]; cell=''; } else cell+=ch; }
  if(cell||row.length){ row.push(cell); rows.push(row); }
  return rows.filter(r=>r.some(c=>c.trim()));
}
async function importCsv(text){
  const rows=parseCsv(text); if(rows.length<2){ toast('That CSV has no rows'); return; }
  const h=rows[0].map(x=>x.trim().toLowerCase());
  const col=(...names)=>{ for(const n of names){ const i=h.findIndex(x=>x===n||x.includes(n)); if(i>-1) return i; } return -1; };
  const ix={name:col('business','company','name'),contact:col('contact','owner','founder'),email:col('email'),phone:col('phone','mobile'),website:col('website','site','url'),instagram:col('instagram','ig'),category:col('category','type','industry'),city:col('city','suburb','town'),state:col('state'),pipeline:col('pipeline','service'),stage:col('stage','status'),mrr:col('mrr','retainer'),value:col('value','quote'),mockup:col('mockup','showcase'),batch:col('batch'),priority:col('priority'),notes:col('notes')};
  if(ix.name<0){ toast('The CSV needs a business or name column'); return; }
  let added=0, skipped=0;
  for(const r of rows.slice(1)){ const g=k=>ix[k]>-1?(r[ix[k]]||'').trim():''; if(!g('name')) continue;
    if(findDupe(g('name'),g('email'),g('website'))){ skipped++; continue; }
    const cid=await createCompany({name:g('name'),contactName:g('contact'),email:g('email'),phone:g('phone'),website:g('website'),instagram:g('instagram'),category:g('category'),city:g('city'),state:g('state'),notes:g('notes'),source:'CSV import'});
    const pv=g('pipeline').toLowerCase(); const ps=pv.includes('both')?['email','web']:[/web|site/.test(pv)?'web':'email'];
    for(const p of ps) await createOpp(cid,p,{stage:g('stage'),mrr:g('mrr')?Number(g('mrr').replace(/[^0-9.]/g,'')):(p==='email'?setting('coreMrr'):''),value:g('value')?Number(g('value').replace(/[^0-9.]/g,'')):'',mockupUrl:g('mockup'),batch:g('batch'),priority:['high','low'].includes(g('priority').toLowerCase())?g('priority').toLowerCase():'normal'});
    added++; }
  toast(`Imported ${added} lead${added===1?'':'s'}${skipped?`, skipped ${skipped} already here`:''}`);
}
const csvCell=v=>{ const s=String(v==null?'':v); return /[",\n]/.test(s)?'"'+s.replace(/"/g,'""')+'"':s; };
function save(filename,data){ const blob=new Blob([data],{type:filename.endsWith('.json')?'application/json':'text/csv'}); const a=document.createElement('a'); a.href=URL.createObjectURL(blob); a.download=filename; document.body.appendChild(a); a.click(); setTimeout(()=>{ URL.revokeObjectURL(a.href); a.remove(); },1000); }
function gmailNote(){ const g=S.extra&&S.extra.gmail; if(!g||!g.lastRun) return 'Gmail sync not running yet.'; return 'Gmail checked '+fmtAgo(g.lastRun)+(g.summary?' · '+esc(g.summary):''); }
function fmtAgo(iso){ const m=Math.round((Date.now()-new Date(iso))/60000); if(m<2) return 'just now'; if(m<60) return m+' min ago'; const h=Math.round(m/60); if(h<24) return h+'h ago'; return fmtDay(iso); }
function exportJson(){ save('tse-crm-backup-'+today()+'.json', JSON.stringify({exportedAt:nowIso(),companies:S.companies,opps:S.opps,acts:S.acts,docs:S.docs,tasks:S.tasks,settings:S.settings},null,2)); }
function exportCsv(){
  const head=['business','contact','email','phone','website','instagram','category','city','state','pipeline','stage','priority','mrr','value','next_follow_up','mockup','batch','last_email','last_subject'];
  const lines=[head.join(',')];
  list(S.companies).forEach(c=>{ const os=oppsOf(c._id); const lo=lastOut(c._id); (os.length?os:[{}]).forEach(o=>lines.push([c.name,c.contactName,c.email,c.phone,c.website,c.instagram,c.category,c.city,c.state,o.pipeline,o.stage,o.priority,o.mrr,o.value,o.nextFollowUp,o.mockupUrl,o.batch,lo?localDay(lo.at):'',lo?lo.subject:''].map(csvCell).join(','))); });
  save('tse-leads-'+today()+'.csv', lines.join('\n'));
}
function exportEmails(){
  const st=emailStats(); const lines=[['date','business','status','subject','angle','replied','days_to_reply','outcome','words','body'].join(',')];
  list(S.acts).filter(isOutEmail).sort((a,b)=>(a.at||'').localeCompare(b.at||'')).forEach(a=>{ const s=st[a._id]||{}; lines.push([localDay(a.at),companyName(a.companyId),a.status,a.subject,a.angle||guessAngle(a.subject,a.body),s.replied?'yes':'no',s.days==null?'':s.days,s.outcome||'',words(a.body),a.body].map(csvCell).join(',')); });
  save('tse-emails-'+today()+'.csv', lines.join('\n'));
}
